<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Map Embed</title>
</head>
<body>
  <h2>My City Location</h2>
  <iframe
    title="Map showing My City"
    src="https://maps.google.com?q=New+Delhi&output=embed"
    width="600"
    height="450"
    style="border:0;"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen>
  </iframe>
</body>
</html>
