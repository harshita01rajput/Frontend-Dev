<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Border & Padding Demonstration</h1>
  <div class="container">
    <div class="box solid padding-small">Solid Border<br>Small Padding</div>
    <div class="box dashed padding-medium">Dashed Border<br>Medium Padding</div>
    <div class="box double padding-large rounded">Double Border<br>Large Padding<br>Rounded Corners</div>
    <div class="box groove rounded">Groove Border<br>Rounded Corners</div>
  </div>
</body>
</html>
