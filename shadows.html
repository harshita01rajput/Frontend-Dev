<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Shadows and Depth Effects</h1>
  <div class="container">
    <div class="card card1">
      <h2>Basic Shadow</h2>
      <p>This card uses a simple, soft shadow for subtle depth.</p>
    </div>
    <div class="card card2">
      <h2>Medium Shadow</h2>
      <p>This card has a medium, more noticeable shadow.</p>
    </div>
    <div class="card card3">
      <h2>Strong Shadow</h2>
      <p>This card features a darker, more dramatic shadow for emphasis.</p>
    </div>
  </div>
</body>
</html>
