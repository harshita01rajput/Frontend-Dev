<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Background Webpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gradient Background Demonstration</h1>
  </header>

  <section class="linear-section">

    <p>Created for Gradient Practice Layout</p>
