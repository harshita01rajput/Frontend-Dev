<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Tooltip Demonstration</h1>
  
  <div class="container">
    <div class="tooltip">
      💡
      <span class="tooltip-text">This is a light bulb icon!</span>
    </div>
    
    <div class="tooltip">
      ❤️
      <span class="tooltip-text">This represents love.</span>
    </div>
    
    <div class="tooltip">
      📘
      <span class="tooltip-text">This is a book icon.</span>
    </div>
    
    <div class="tooltip">
      🌍
      <span class="tooltip-text">This shows the Earth.</span>
    </div>
  </div>
</body>
</html>
