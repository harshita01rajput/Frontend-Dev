<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Advanced CSS Selectors</h1>

  <div class="form-section">
    <input type="text" placeholder="Type your name">
    <input type="email" placeholder="Enter your email">
    <button>Submit</button>
  </div>

  <div class="links-section">
    <a href="https://example.com">Secure Link (HTTPS)</a>
    <a href="http://example.org">Non-secure Link (HTTP)</a>
  </div>

  <ul class="item-list">
    <li>First Item</li>
    <li>Second Item</li>
    <li>Third Item</li>
    <li>Fourth Item</li>
  </ul>

  <div class="container">
    <p>Paragraph 1 inside container.</p>
    <p>Paragraph 2 inside container.</p>
    <span>Sibling Span</span>
    <p>Paragraph 3 after span.</p>
  </div>
</body>
</html>
