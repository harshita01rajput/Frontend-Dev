<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="box box1">Box 1<br>Width: 200px<br>Height: 150px</div>
    <div class="box box2">Box 2<br>Width: 40%<br>Height: 30vh</div>
    <div class="box box3">
      Box 3<br>Width: 20em<br>Min-Height: 100px<br>Max-Width: 250px<br>Overflow Example:<br>
      This text is intentionally long to demonstrate overflow behavior inside the box.
    </div>
  </div>
</body>
</html>
